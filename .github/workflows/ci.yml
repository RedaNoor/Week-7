name: Week 8 validation

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q backend/app scripts dashboard_week8.py
      - name: Run regression tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/test_property_catalog.py backend/tests_week8_ml.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx eslint src/app/page.tsx