services:
  backend:
    build: .
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: production
      DATABASE_URL: ""
      REQUIRE_AUTH: "true"
      API_KEY: ${API_KEY:?Set API_KEY in the deployment environment}
      ML_REQUIRE_ARTIFACT: "true"
      TRUSTED_ORIGINS: http://localhost:8501,http://localhost:3000
    ports:
      - "8001:8000"

  dashboard:
    build: .
    command: python -m streamlit run dashboard_week8.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      WEEK8_API_URL: http://backend:8000
      WEEK8_API_KEY: ${API_KEY:?Set API_KEY in the deployment environment}
    depends_on:
      - backend
    ports:
      - "8501:8501"