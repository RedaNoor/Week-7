# nixpacks.toml — Build config for Railway (Next.js frontend)
# Railway auto-detects Node.js and runs npm run build, then npm start.
# We override startCmd to use the standalone output.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = [
  "npm run build",
  "cp -r .next/static .next/standalone/.next/static || true",
  "cp -r public .next/standalone/public || true"
]

[start]
cmd = "node .next/standalone/server.js"
